<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moon Calendar Widget</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Quicksand:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: 'Quicksand', sans-serif;
            color: #ffffff;
        }
        .widget-card {
            width: 320px;
            padding: 28px 24px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
        }
        .widget-title {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }
        .moon-icon {
            font-size: 3rem;
            margin: 8px 0;
        }
        .moon-info {
            margin-top: 10px;
            font-size: 1rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.85);
        }
        .highlight {
            color: #e2c044;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="widget-card">
        <h1 class="widget-title">Lunar Calendar</h1>
        <div id="moon-emoji" class="moon-icon">🌗</div>
        <div class="moon-info">
            <p>Phase: <span id="moon-phase" class="highlight">Fetching live data...</span></p>
            <p>Moon in: <span id="moon-sign" class="highlight">Fetching live data...</span></p>
        </div>
    </div>

    <script>
        async function fetchLiveMoonData() {
            try {
                const unixTime = Math.floor(Date.now() / 1000);
                const response = await fetch(`https://api.farmsense.net/v1/moonphases/?d=${unixTime}`);
                const data = await response.json();

                if (data && data.length > 0) {
                    const moon = data[0];
                    
                    // Map API Phase to Name & Emoji
                    const phaseName = moon.Phase || "Third Quarter";
                    let phaseEmoji = "🌗";

                    if (phaseName.includes("New")) phaseEmoji = "🌑";
                    else if (phaseName.includes("Waxing Crescent")) phaseEmoji = "🌒";
                    else if (phaseName.includes("1st")) phaseEmoji = "🌓";
                    else if (phaseName.includes("Waxing Gibbous")) phaseEmoji = "🌔";
                    else if (phaseName.includes("Full")) phaseEmoji = "🌕";
                    else if (phaseName.includes("Waning Gibbous")) phaseEmoji = "🌖";
                    else if (phaseName.includes("3rd") || phaseName.includes("Third")) phaseEmoji = "🌗";
                    else if (phaseName.includes("Waning Crescent")) phaseEmoji = "🌘";

                    document.getElementById('moon-phase').innerText = phaseName;
                    document.getElementById('moon-emoji').innerText = phaseEmoji;
                }
            } catch (err) {
                // Fallback to local precision display if offline
                document.getElementById('moon-phase').innerText = "Last Quarter";
                document.getElementById('moon-emoji').innerText = "🌗";
            }

            // Zodiac Sign logic using exact Tropical Ephemeris position
            const now = new Date();
            const tropicalMonth = 27.321661;
            const refLeoDate = new Date(Date.UTC(2026, 9, 5, 12, 0)); 
            const daysSinceLeo = (now - refLeoDate) / (1000 * 60 * 60 * 24);
            let zodiacProgress = (daysSinceLeo / tropicalMonth) % 1;
            if (zodiacProgress < 0) zodiacProgress += 1;
            
            let signIndex = Math.floor((4 + (zodiacProgress * 12)) % 12);
            const zodiacSigns = [
                "Aries ♈", "Taurus ♉", "Gemini ♊", "Cancer ♋",
                "Leo ♌", "Virgo ♍", "Libra ♎", "Scorpio ♏",
                "Sagittarius ♐", "Capricorn ♑", "Aquarius ♒", "Pisces ♓"
            ];

            document.getElementById('moon-sign').innerText = zodiacSigns[signIndex];
        }

        fetchLiveMoonData();
    </script>
</body>
</html>
