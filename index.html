<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Celestial Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="widget-container">
    
    <!-- 8-POINT CORNER STARS & ACCENTS -->
    <span class="star-8 glow star-top-left">✴</span>
    <span class="star-8 glow star-top-right">✴</span>
    <span class="star-8 glow star-mid-left">✴</span>
    <span class="star-8 glow star-bottom-right">✴</span>

    <!-- 4-POINT ACCENT DIAMONDS -->
    <span class="diamond-4 diamond-top-mid">✦</span>
    <span class="diamond-4 diamond-mid-right">✦</span>
    <span class="diamond-4 diamond-bottom-left">✦</span>

    <!-- HEADER -->
    <header class="header">
      <h1 class="main-title">CELESTIAL GUIDE</h1>
    </header>

    <!-- SUBHEADER WITH MOTIFS -->
    <div class="subheader">
      <span class="motif">✦</span>
      <span class="sub-text">LUNAR EPHEMERIS</span>
      <span class="motif">✦</span>
    </div>

    <!-- MOON DISPLAY -->
    <div class="moon-display">
      <div class="moon-graphic-container">
        <span class="side-sparkle">✦</span>
        <div id="moon-graphic" class="moon-graphic"></div>
        <span class="side-sparkle">✦</span>
      </div>
    </div>

    <!-- DETAILS SECTION (LEFT-SIDE SPACING) -->
    <div class="details-section">
      <div class="detail-row">
        <span class="label">PHASE:</span>
        <span id="phase-name" class="value">Last Quarter</span>
      </div>
      <div class="detail-row">
        <span class="label">MOON IN:</span>
        <span id="zodiac-sign" class="value">Leo</span>
        <span id="zodiac-emoji" class="emoji">♌︎</span>
      </div>
    </div>

    <!-- BOTTOM STATS (LEXEND FONT) -->
    <div class="stats-section">
      <div class="stat-box">
        <span class="stat-label">ILLUMINATION</span>
        <span id="illumination-value" class="stat-value lexend">4%</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">LUNAR AGE</span>
        <span id="lunar-age-value" class="stat-value lexend">27.2 DAYS</span>
      </div>
    </div>

  </div>
  <script src="renderer.js"></script>
</body>
</html>
