<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Add Google Fonts link at top of <head> -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <title>Reading the Stars</title>
  <style>
    html, body {
      background: transparent !important;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: font-family: 'Plus Jakarta Sans', sans-serif;
    }
/* Inside <style> block */
h2 {
    font-family: 'Cinzel', serif !important;
    font-size: 32px !important;            /* Scaled up for strong hierarchy */
    font-weight: 600 !important;
    letter-spacing: 3px !important;
    margin: 0 0 4px 0 !important;
}

    .widget-card {
      position: relative;
      background: rgba(10, 12, 20, 0.60) !important;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
      
      -webkit-app-region: drag !important;
      user-select: none;
      overflow: hidden;
    }

    .widget-card * {
      pointer-events: none !important;
    }

    h1, h2, h3, p, span, div {
      color: #ffffff !important;
      text-shadow: none !important;
    }

    /* --- SHOOTING STAR ANIMATION --- */
    @keyframes shootingStar {
      0% {
        transform: translate(0, 0) rotate(-35deg) scale(0);
        opacity: 0;
      }
      10% {
        transform: translate(-30px, 20px) rotate(-35deg) scale(1);
        opacity: 1;
      }
      30% {
        transform: translate(-160px, 100px) rotate(-35deg) scale(0.2);
        opacity: 0;
      }
      100% {
        transform: translate(-160px, 100px) rotate(-35deg) scale(0);
        opacity: 0;
      }
    }

    .shooting-star {
      position: absolute;
      top: 25px;
      right: 10px;
      width: 90px;
      height: 2px;
      background: linear-gradient(90deg, #ffffff, rgba(255, 255, 255, 0));
      border-radius: 999px;
      box-shadow: 0 0 8px #ffffff;
      animation: shootingStar 4s infinite linear;
      z-index: 10;
    }

    /* --- TWINKLING BACKGROUND STARS --- */
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.4); }
    }

    .star-twinkle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 6px #ffffff;
      animation: twinkle 3s infinite ease-in-out;
      z-index: 5;
    }

    .star-1 { top: 20px; left: 25px; animation-delay: 0s; }
    .star-2 { top: 60px; right: 30px; animation-delay: 1.2s; }
    .star-3 { bottom: 25px; left: 40px; animation-delay: 2.1s; }
  </style>
</head>
<body>

<div class="widget-card">
  <!-- Starfield & Animations -->
  <div class="shooting-star"></div>
  <div class="star-twinkle star-1"></div>
  <div class="star-twinkle star-2"></div>
  <div class="star-twinkle star-3"></div>

  <!-- Proportioned Content -->
  <div style="text-align: center; padding: 4px 8px;">
    <h2>READING THE STARS</h2>
    <div style="font-size: 13px; letter-spacing: 3px; opacity: 0.8; margin-bottom: 24px;">✦ LUNAR EPHEMERIS ✦</div>

    <div style="margin: 20px 0; display: flex; align-items: center; justify-content: center; gap: 20px;">
      <span style="font-size: 16px; opacity: 0.85;">✦</span>
      <div style="width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(90deg, #fffdf0 50%, #181a26 50%); box-shadow: 0 0 20px rgba(255, 253, 240, 0.35);"></div>
      <span style="font-size: 16px; opacity: 0.85;">✦</span>
    </div>

    <div style="font-size: 15px; opacity: 0.9; margin-bottom: 6px;">PHASE: <strong style="color: #fff; font-weight: 600;">Last Quarter</strong></div>
    <div style="font-size: 15px; opacity: 0.9;">MOON IN: <strong style="color: #fff; font-weight: 600;">Leo ♌</strong></div>

    <div style="margin-top: 24px; padding: 16px 20px; border: 1px dashed rgba(255,255,255,0.3); border-radius: 18px; font-style: italic; font-size: 15px; opacity: 0.95; line-height: 1.5;">
      "Lead with warm-hearted clarity and embrace your creative expression."
    </div>
  </div>
</div>

</body>
</html>
