<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading the Stars</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Quicksand:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1e1b3a 0%, #0c0b18 100%);
            font-family: 'Quicksand', sans-serif;
            color: #f3f0e6;
        }

        .widget-card {
            width: 340px;
            padding: 34px 28px 24px 28px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(252, 238, 203, 0.2);
            box-shadow: 0 16px 48px 0 rgba(0, 0, 0, 0.5),
                        inset 0 1px 1px 0 rgba(255, 255, 255, 0.25);
            text-align: center;
            position: relative;
            transition: all 0.3s ease;
        }

        .widget-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.9rem;
            font-weight: 400;
            letter-spacing: 2.5px;
            margin-bottom: 4px;
            color: #fceecb;
            text-shadow: 0 0 12px rgba(252, 238, 203, 0.35);
        }

        .widget-subtitle {
            font-size: 0.72rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(243, 240, 230, 0.5);
            margin-bottom: 22px;
        }

        .illustration-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 18px 0 22px 0;
        }

        .sparkle {
            font-size: 1.1rem;
            color: #fceecb;
            opacity: 0.85;
            animation: pulse 3s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.15); }
        }

        .moon-graphic {
            width: 80px;
            height: 80px;
            margin: 0 16px;
            filter: drop-shadow(0 0 16px rgba(252, 238, 203, 0.45));
        }

        .moon-info {
            margin-top: 10px;
            font-size: 0.98rem;
            line-height: 1.8;
            color: rgba(243, 240, 230, 0.85);
        }

        .label {
            font-size: 0.85rem;
            color: rgba(243, 240, 230, 0.5);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .highlight {
            color: #fceecb;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .symbol {
            color: #fceecb;
            font-size: 1.1rem;
            margin-left: 6px;
            vertical-align: middle;
            display: inline-block;
        }

        /* Shortcuts Toggle Button */
        .drawer-toggle {
            margin-top: 22px;
            padding-top: 14px;
            border-top: 1px solid rgba(252, 238, 203, 0.15);
            font-size: 0.78rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(252, 238, 203, 0.7);
            cursor: pointer;
            user-select: none;
            transition: color 0.3s ease;
        }

        .drawer-toggle:hover {
            color: #fceecb;
        }

        .shortcuts-container {
            display: none;
            margin-top: 14px;
        }

        .shortcuts-container.open {
            display: block;
        }

        .shortcut-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .shortcut-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(252, 238, 203, 0.1);
            color: #f3f0e6;
            text-decoration: none;
            font-size: 0.88rem;
            transition: all 0.25s ease;
        }

        .shortcut-item:hover {
            background: rgba(252, 238, 203, 0.15);
            border-color: rgba(252, 238, 203, 0.3);
        }

        .shortcut-icon {
            font-size: 0.85rem;
            color: rgba(252, 238, 203, 0.7);
        }
    </style>
</head>
<body>
    <div class="widget-card">
        <h1 class="widget-title">Reading the Stars</h1>
        <p class="widget-subtitle">✦ Lunar Ephemeris ✦</p>

        <div class="illustration-container">
            <span class="sparkle">✦</span>
            <svg class="moon-graphic" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="42" fill="#151328" stroke="#fceecb" stroke-width="1.5" />
                <path d="M 50 8 A 42 42 0 0 1 50 92 A 12 42 0 0 1 50 8 Z" fill="#fceecb" />
            </svg>
            <span class="sparkle">✦</span>
        </div>

        <div class="moon-info">
            <p><span class="label">Phase:</span> <span id="moon-phase" class="highlight">Last Quarter</span></p>
            <p><span class="label">Moon in:</span> <span id="moon-sign" class="highlight">Leo</span> <span class="symbol" id="zodiac-icon">&#9804;&#65038;</span></p>
        </div>

        <!-- Toggle Drawer for Work Shortcuts -->
        <div class="drawer-toggle" onclick="toggleShortcuts()">
            <span id="toggle-label">✦ Work Shortcuts ▾</span>
        </div>

        <div class="shortcuts-container" id="shortcuts-drawer">
            <ul class="shortcut-list">
                <li><a href="https://mail.google.com/mail/u/0/#inbox" target="_blank" class="shortcut-item"><span>📧 Gmail Inbox</span><span class="shortcut-icon">↗</span></a></li>
                <li><a href="
