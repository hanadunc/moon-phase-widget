<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading the Stars</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Quicksand:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #090814;
            font-family: 'Quicksand', sans-serif;
            color: #f3f0e6;
            overflow: hidden;
            position: relative;
        }

        /* Ethereal Nebula Background Glows */
        .nebula-1 {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(142, 68, 173, 0.18) 0%, transparent 70%);
            filter: blur(60px);
            animation: floatNebula 20s infinite ease-in-out alternate;
        }

        .nebula-2 {
            position: absolute;
            bottom: -10%;
            right: -10%;
            width: 65vw;
            height: 65vw;
            background: radial-gradient(circle, rgba(41, 128, 185, 0.15) 0%, transparent 70%);
            filter: blur(70px);
            animation: floatNebula 25s infinite ease-in-out alternate-reverse;
        }

        @keyframes floatNebula {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, -30px) scale(1.1); }
        }

        /* Ambient Starfield Overlay */
        .starfield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: #fceecb;
            border-radius: 50%;
            animation: twinkle linear infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 0.9; transform: scale(1.3); }
        }

        /* Constellation Background Lines */
        .constellation-svg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            opacity: 0.25;
            z-index: 0;
        }

        /* Widget Main Card */
        .widget-card {
            width: 340px;
            padding: 32px 26px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(252, 238, 203, 0.25);
            box-shadow: 0 20px 60px 0 rgba(0, 0, 0, 0.6),
                        inset 0 1px 1px 0 rgba(255, 255, 255, 0.3);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .widget-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.9rem;
            font-weight: 400;
            letter-spacing: 2.5px;
            margin-bottom: 4px;
            color: #fceecb;
            text-shadow: 0 0 12px rgba(252, 238, 203, 0.4);
        }

        .widget-subtitle {
            font-size: 0.72rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(243, 240, 230, 0.5);
            margin-bottom: 18px;
        }

        .illustration-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 14px 0 18px 0;
        }

        .sparkle {
            font-size: 1.1rem;
            color: #fceecb;
            opacity: 0.85;
            animation: pulse 3s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.15); }
        }

        .moon-graphic {
            width: 80px;
            height: 80px;
            margin: 0 16px;
            filter: drop-shadow(0 0 18px rgba(252, 238, 203, 0.5));
        }

        .moon-info {
            margin-top: 8px;
            font-size: 0.95rem;
            line-height: 1.8;
            color: rgba(243, 240, 230, 0.85);
        }

        .label {
            font-size: 0.82rem;
            color: rgba(243, 240, 230, 0.5);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .highlight {
            color: #fceecb;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .symbol {
            color: #fceecb;
            font-size: 1.1rem;
            margin-left: 6px;
            vertical-align: middle;
            display: inline-block;
        }

        .daily-reflection {
            margin-top: 14px;
            padding: 10px 12px;
            border-radius: 14px;
            background: rgba(252, 238, 203, 0.06);
            border: 1px dashed rgba(252, 238, 203, 0.25);
            font-style: italic;
            font-size: 0.82rem;
            line-height: 1.5;
            color: rgba(252, 238, 203, 0.9);
        }

        .shortcut-section {
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid rgba(252, 238, 203, 0.15);
        }

        .shortcut-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .shortcut-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 14px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(252, 238, 203, 0.12);
            color: #f3f0e6;
            text-decoration: none;
            font-size: 0.85rem;
            transition: all 0.25s ease;
        }

        .shortcut-item:hover {
            background: rgba(252, 238, 203, 0.15);
            border-color: rgba(252, 238, 203, 0.35);
            transform: translateY(-1px);
        }

        .shortcut-icon {
            font-size: 0.85rem;
            color: rgba(252, 238, 203, 0.7);
        }
    </style>
</head>
<body>
    <!-- Background Ambient Nebulae -->
    <div class="nebula-1"></div>
    <div class="nebula-2"></div>

    <!-- Background Twinkling Stars -->
    <div class="starfield" id="starfield"></div>

    <!-- Background Constellations -->
    <svg class="constellation-svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice">
        <g stroke="#fceecb" stroke-width="0.8" fill="none">
            <!-- Ursa Major/Minor Style Astrologies -->
            <polyline points="150,180 220,150 280,210 360,190 420,280 340,320 280,210" />
            <circle cx="150" cy="180" r="2.5" fill="#fceecb" />
            <circle cx="220" cy="150" r="2.5" fill="#fceecb" />
            <circle cx="280" cy="210" r="2.5" fill="#fceecb" />
            <circle cx="360" cy="190" r="2.5" fill="#fceecb" />
            <circle cx="420" cy="280" r="2.5" fill="#fceecb" />
            <circle cx="340" cy="320" r="2.5" fill="#fceecb" />

            <!-- Cassiopeia Style Line (Right Side) -->
            <polyline points="720,120 780,180 820,140 890,220 940,190" />
            <circle cx="720" cy="120" r="2.5" fill="#fceecb" />
            <circle cx="780" cy="180" r="2.5" fill="#fceecb" />
            <circle cx="820" cy="140" r="2.5" fill="#fceecb" />
            <circle cx="890" cy="220" r="2.5" fill="#fceecb" />
            <circle cx="940" cy="190" r="2.5" fill="#fceecb" />

            <!-- Southern Constellation (Bottom Left) -->
            <polyline points="100,780 180,820 250,750 310,840" />
            <circle cx="100" cy="780" r="2.5" fill="#fceecb" />
            <circle cx="180" cy="820" r="2.5" fill="#fceecb" />
            <circle cx="250" cy="750" r="2.5" fill="#fceecb" />
            <circle cx="310" cy="840" r="2.5" fill="#fceecb" />
        </g>
    </svg>

    <!-- Main Dashboard Card -->
    <div class="widget-card">
        <h1 class="widget-title">Reading the Stars</h1>
        <p class="widget-subtitle">✦ Lunar Ephemeris ✦</p>

        <div class="illustration-container">
            <span class="sparkle">✦</span>
            <svg class="moon-graphic" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="42" fill="#151328" stroke="#fceecb" stroke-width="1.5" />
                <path id="moon-path" d="M 50 8 A 42 42 0 0 0 50 92 A 0 42 0 0 0 50 8 Z" fill="#fceecb" />
            </svg>
            <span class="sparkle">✦</span>
        </div>

        <div class="moon-info">
            <p><span class="label">Phase:</span> <span id="moon-phase" class="highlight">Last Quarter</span></p>
            <p><span class="label">Moon in:</span> <span id="moon-sign" class="highlight">Leo</span> <span class="symbol" id="zodiac-icon">&#9804;&#65038;</span></p>
        </div>

        <div class="daily-reflection" id="reflection-text">
            "Lead with warm-hearted clarity and embrace your creative expression."
        </div>

        <div class="shortcut-section">
            <ul class="shortcut-list">
                <li><a href="https://mail.google.com/mail/u/0/#inbox" target="_blank" class="shortcut-item"><span>📧 Gmail Inbox</span><span class="shortcut-icon">↗</span></a></li>
                <li><a href="https://app.clickup.com/9011642634/v/l/li/901113023209?pr=90113938743" target="_blank" class="shortcut-item"><span>✅ ClickUp Tasks</span><span class="shortcut-icon">↗</span></a></li>
                <li><a href="https://docs.google.com/spreadsheets/u/0/?tgif=d" target="_blank" class="shortcut-item"><span>📊 Google Sheets</span><span class="shortcut-icon">↗</span></a></li>
            </ul>
        </div>
    </div>

    <script>
        // Generate Twinkling Stars Programmatically
        function generateStars() {
            const starfield = document.getElementById('starfield');
            const starCount = 60;
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.animationDuration = `${Math.random() * 3 + 2}s`;
                star.style.animationDelay = `${Math.random() * 3}s`;
                starfield.appendChild(star);
            }
        }
        generateStars();

        const reflections = {
            "Aries": "Pioneer your intentions with courageous initiative and steady focus.",
            "Taurus": "Ground yourself in comfort, deliberate pace, and sensory presence.",
            "Gemini": "Follow your curiosity and embrace lighthearted, clear communication.",
            "Cancer": "Honor your inner landscape and protect your energetic boundaries.",
            "Leo": "Lead with warm-hearted clarity and embrace your creative expression.",
            "Virgo": "Refine your daily systems with gentle discernment and mindful care.",
            "Libra": "Seek harmony in your environment and cultivate graceful balance.",
            "Scorpio": "Trust your intuition and channel your depth into purposeful transformation.",
            "Sagittarius": "Expand your perspective and seek wisdom in every interaction.",
            "Capricorn": "Build towards your aspirations with steady discipline and quiet mastery.",
            "Aquarius": "Honor your unique perspective and cultivate inspiring connections.",
            "Pisces": "Surrender to the flow of imagination and nurture your compassionate spirit."
        };

        function updateSVGPhase(phaseName) {
            const path = document.getElementById('moon-path');
            const name = phaseName.toLowerCase();

            if (name.includes("new")) {
                path.setAttribute("d", "M 50 8 A 42 42 0 0 1 50 92 A 42 42 0 0 1 50 8 Z");
                path.setAttribute("fill", "#151328");
            } else if (name.includes("full")) {
                path.setAttribute("d", "M 50 8 A 42 42 0 1 1 49.9 8 Z");
                path.setAttribute("fill", "#fceecb");
            } else if (name.includes("waxing crescent")) {
                path.setAttribute("d", "M 50 8 A 42 42 0 0 1 50 92 A 26 42 0 0 0 50 8 Z");
                path.setAttribute("fill", "#fceecb");
            } else if (name.includes("1st") || name.includes("first quarter")) {
                path.setAttribute("d", "M 50 8 A 42 42 0 0 1 50 92 A 0 42 0 0 1 50 8 Z");
                path.setAttribute("fill", "#fceecb");
            } else if (name.includes("waxing gibbous")) {
                path.setAttribute("d", "M 50 8 A 42 42 0 0 1 50 92 A 26 42 0 0 1 50 8 Z");
                path.setAttribute("fill", "#fceecb");
            } else if (name.includes("waning gibbous")) {
                path.setAttribute("d", "M 50 8 A 42 42 0 0 0 50 92 A 26 42 0 0 0 50 8 Z");
                path.setAttribute("fill", "#fceecb");
            } else if (name.includes("3rd") || name.includes("third quarter") || name.includes("last quarter")) {
                path.setAttribute("d", "M 50 8 A 42 42 0 0 0 50 92 A 0 42 0 0 0 50 8 Z");
                path.setAttribute("fill", "#fceecb");
            } else if (name.includes("waning crescent")) {
                path.setAttribute("d", "M 50 8 A 42 42 0 0 0 50 92 A 26 42 0 0 1 50 8 Z");
                path.setAttribute("fill", "#fceecb");
            }
        }

        async function fetchLiveMoonData() {
            try {
                const unixTime = Math.floor(Date.now() / 1000);
                const response = await fetch(`https://api.farmsense.net/v1/moonphases/?d=${unixTime}`);
                const data = await response.json();

                if (data && data.length > 0) {
                    const moon = data[0];
                    const phaseName = moon.Phase || "Last Quarter";
                    document.getElementById('moon-phase').innerText = phaseName;
                    updateSVGPhase(phaseName);
                }
            } catch (err) {
                document.getElementById('moon-phase').innerText = "Last Quarter";
                updateSVGPhase("Last Quarter");
            }

            const now = new Date();
            const tropicalMonth = 27.321661;
            const refLeoDate = new Date(Date.UTC(2026, 9, 5, 12, 0)); 
            const daysSinceLeo = (now - refLeoDate) / (1000 * 60 * 60 * 24);
            let zodiacProgress = (daysSinceLeo / tropicalMonth) % 1;
            if (zodiacProgress < 0) zodiacProgress += 1;
            
            let signIndex = Math.floor((4 + (zodiacProgress * 12)) % 12);
            const zodiacNames = ["Aries", "Taurus", "Gemini", "Cancer", "Leo", "Virgo", "Libra", "Scorpio", "Sagittarius", "Capricorn", "Aquarius", "Pisces"];
            const zodiacEntities = ["&#9800;&#65038;", "&#9801;&#65038;", "&#9802;&#65038;", "&#9803;&#65038;", "&#9804;&#65038;", "&#9805;&#65038;", "&#9806;&#65038;", "&#9807;&#65038;", "&#9808;&#65038;", "&#9809;&#65038;", "&#9810;&#65038;", "&#9811;&#65038;"];

            const activeSign = zodiacNames[signIndex];
            document.getElementById('moon-sign').innerText = activeSign;
            document.getElementById('zodiac-icon').innerHTML = zodiacEntities[signIndex];
            
            if (reflections[activeSign]) {
                document.getElementById('reflection-text').innerText = `"${reflections[activeSign]}"`;
            }
        }

        fetchLiveMoonData();
    </script>
</body>
</html>
