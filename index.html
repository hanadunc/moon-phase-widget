<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Celestial Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="widget-container">
    
<!-- SPACIOUS, WIDELY SCATTERED CELESTIAL STARDUST FIELD -->
<svg class="stardust-bg" viewBox="0 0 310 330" fill="none">
  <!-- Left Wing (Fanned Out) -->
  <circle cx="90" cy="72" r="1.1" fill="#E3C896" class="star-dot dot-1"/>
  <circle cx="42" cy="118" r="0.8" fill="#E3C896" class="star-dot dot-3"/>
  <circle cx="108" cy="165" r="1.4" fill="#E3C896" class="star-dot dot-2"/>
  <circle cx="68" cy="182" r="0.9" fill="#E3C896" class="star-dot dot-4"/>

  <!-- Right Wing (Fanned Out) -->
  <circle cx="218" cy="74" r="0.9" fill="#E3C896" class="star-dot dot-2"/>
  <circle cx="262" cy="112" r="1.3" fill="#E3C896" class="star-dot dot-4"/>
  <circle cx="202" cy="172" r="1.1" fill="#E3C896" class="star-dot dot-1"/>
  <circle cx="242" cy="188" r="0.8" fill="#E3C896" class="star-dot dot-3"/>

  <!-- Subtle Ambient Dust Accents -->
  <circle cx="128" cy="92" r="0.7" fill="#E3C896" class="star-dot dot-3"/>
  <circle cx="182" cy="194" r="0.7" fill="#E3C896" class="star-dot dot-1"/>
</svg>

       <!-- TOP LEFT HERO NEEDLE STAR -->
<svg class="star-8pt star-top-left" viewBox="0 0 24 48" width="24" height="48">
  <path d="M12 0 L13.2 20 L20 18 L15 22 L24 24 L15 26 L20 30 L13.2 28 L12 48 L10.8 28 L4 30 L9 26 L0 24 L9 22 L4 18 L10.8 20 Z" fill="#E3C896"/>
</svg>

<!-- MID RIGHT ACCENT NEEDLE STAR -->
<svg class="star-8pt star-mid-right" viewBox="0 0 24 48" width="24" height="48">
  <path d="M12 0 L13.2 20 L20 18 L15 22 L24 24 L15 26 L20 30 L13.2 28 L12 48 L10.8 28 L4 30 L9 26 L0 24 L9 22 L4 18 L10.8 20 Z" fill="#E3C896"/>
</svg>

<!-- BOTTOM LEFT ASYMMETRICAL NEEDLE STAR -->
<svg class="star-8pt star-bottom-left" viewBox="0 0 24 48" width="24" height="48">
  <path d="M12 0 L13.2 20 L20 18 L15 22 L24 24 L15 26 L20 30 L13.2 28 L12 48 L10.8 28 L4 30 L9 26 L0 24 L9 22 L4 18 L10.8 20 Z" fill="#E3C896"/>
</svg>

<!-- BOTTOM RIGHT ASYMMETRICAL NEEDLE STAR -->
<svg class="star-8pt star-bottom-right" viewBox="0 0 24 48" width="24" height="48">
  <path d="M12 0 L13.2 20 L20 18 L15 22 L24 24 L15 26 L20 30 L13.2 28 L12 48 L10.8 28 L4 30 L9 26 L0 24 L9 22 L4 18 L10.8 20 Z" fill="#E3C896"/>
</svg>

    <!-- HEADER -->
    <header class="header">
      <div class="title-row">
        <span class="motif">✦</span>
        <h1 class="main-title">LUNAR CYCLE</h1>
        <span class="motif">✦</span>
      </div>
      <div class="subheader">READING THE STARS</div>
    </header>

    <!-- MOON DISPLAY -->
    <div class="moon-display">
      <div id="moon-graphic" class="moon-graphic"></div>
    </div>

    <!-- DETAILS SECTION -->
    <div class="details-section">
      <div class="zodiac-row">
        <span class="zodiac-title">MOON IN <span id="zodiac-sign">VIRGO</span></span>
        <span id="zodiac-symbol" class="zodiac-symbol">♍︎</span>
      </div>
      <div id="phase-name" class="phase-subtitle">WANING CRESCENT</div>
    </div>

    <!-- SYMMETRICAL DUAL-DIAMOND DIVIDER LINE -->
<div class="divider-wrapper">
  <svg class="diamond-pin" width="10" height="10" viewBox="0 0 100 100">
    <path d="M50 0 L55 45 L100 50 L55 55 L50 100 L45 55 L0 50 L45 45 Z" fill="#E6CA65"/>
  </svg>
  <div class="divider-line"></div>
  <svg class="diamond-pin" width="10" height="10" viewBox="0 0 100 100">
    <path d="M50 0 L55 45 L100 50 L55 55 L50 100 L45 55 L0 50 L45 45 Z" fill="#E6CA65"/>
  </svg>
</div>

    <!-- BOTTOM STATS -->
    <div class="stats-section">
      <div class="stat-box">
        <span class="stat-label">ILLUMINATION</span>
        <span id="illumination-value" class="stat-value lexend">4%</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">MOON AGE (DAYS)</span>
        <span id="lunar-age-value" class="stat-value lexend">27.2</span>
      </div>
    </div>

  </div>
  <script src="renderer.js"></script>
</body>
</html>
