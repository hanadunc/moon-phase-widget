<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moon Calendar Widget</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Quicksand:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: 'Quicksand', sans-serif;
            color: #ffffff;
        }
        .widget-card {
            width: 320px;
            padding: 24px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
        }
        .widget-title {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }
        .moon-info {
            margin-top: 12px;
            font-size: 1rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.85);
        }
        .highlight {
            color: #e2c044;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="widget-card">
        <h1 class="widget-title">Lunar Calendar</h1>
        <div class="moon-info">
            <p>Phase: <span id="moon-phase" class="highlight">Loading...</span></p>
            <p>Moon in: <span id="moon-sign" class="highlight">Loading...</span></p>
        </div>
    </div>
</body>
</html>
