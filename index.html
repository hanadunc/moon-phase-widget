<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moon Calendar Widget</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Quicksand:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: 'Quicksand', sans-serif;
            color: #ffffff;
        }
        .widget-card {
            width: 320px;
            padding: 28px 24px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
        }
        .widget-title {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }
        .moon-icon {
            font-size: 3rem;
            margin: 8px 0;
        }
        .moon-info {
            margin-top: 10px;
            font-size: 1rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.85);
        }
        .highlight {
            color: #e2c044;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="widget-card">
        <h1 class="widget-title">Lunar Calendar</h1>
        <div id="moon-emoji" class="moon-icon">🌗</div>
        <div class="moon-info">
            <p>Phase: <span id="moon-phase" class="highlight">Calculating...</span></p>
            <p>Moon in: <span id="moon-sign" class="highlight">Calculating...</span></p>
        </div>
    </div>

    <script>
        function calculateMoonData() {
            const now = new Date();
            
            // Precision calibrated anchors for October 2026
            // Reference Third Quarter Moon: Oct 3, 2026 08:00 UTC
            const synodicMonth = 29.5305877;
            const refPhaseDate = new Date(Date.UTC(2026, 9, 3, 8, 0));
            const daysSinceRefPhase = (now - refPhaseDate) / (1000 * 60 * 60 * 24);
            
            // Phase age offset from Third Quarter (~22.14 days into cycle)
            let phaseAge = (22.147 + daysSinceRefPhase) % synodicMonth;
            if (phaseAge < 0) phaseAge += synodicMonth;

            let phaseName = "";
            let phaseEmoji = "🌗";

            if (phaseAge < 1.84) { phaseName = "New Moon"; phaseEmoji = "🌑"; }
            else if (phaseAge < 5.53) { phaseName = "Waxing Crescent"; phaseEmoji = "🌒"; }
            else if (phaseAge < 9.22) { phaseName = "First Quarter"; phaseEmoji = "🌓"; }
            else if (phaseAge < 12.91) { phaseName = "Waxing Gibbous"; phaseEmoji = "🌔"; }
            else if (phaseAge < 16.61) { phaseName = "Full Moon"; phaseEmoji = "🌕"; }
            else if (phaseAge < 20.30) { phaseName = "Waning Gibbous"; phaseEmoji = "🌖"; }
            else if (phaseAge < 23.99) { phaseName = "Third Quarter"; phaseEmoji = "🌗"; }
            else if (phaseAge < 27.68) { phaseName = "Waning Crescent"; phaseEmoji = "🌘"; }
            else { phaseName = "New Moon"; phaseEmoji = "🌑"; }

            // Precision Tropical Zodiac Anchor: Moon entered Leo ~Oct 5, 2026
            const tropicalMonth = 27.321661;
            const refLeoDate = new Date(Date.UTC(2026, 9, 5, 12, 0)); 
            const daysSinceLeo = (now - refLeoDate) / (1000 * 60 * 60 * 24);
            
            // 4. Leo is index 4 in tropical zodiac array (Aries=0, Taurus=1, Gemini=2, Cancer=3, Leo=4)
            let zodiacProgress = (daysSinceLeo / tropicalMonth) % 1;
            if (zodiacProgress < 0) zodiacProgress += 1;
            
            let signIndex = Math.floor((4 + (zodiacProgress * 12)) % 12);

            const zodiacSigns = [
                "Aries ♈", "Taurus ♉", "Gemini ♊", "Cancer ♋",
                "Leo ♌", "Virgo ♍", "Libra ♎", "Scorpio ♏",
                "Sagittarius ♐", "Capricorn ♑", "Aquarius ♒", "Pisces ♓"
            ];

            document.getElementById('moon-phase').innerText = phaseName;
            document.getElementById('moon-emoji').innerText = phaseEmoji;
            document.getElementById('moon-sign').innerText = zodiacSigns[signIndex];
        }

        calculateMoonData();
    </script>
</body>
</html>
