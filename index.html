<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lunar Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Lexend:wght@300;400;500&display=swap" rel="stylesheet">
  
  <style>
    html, body {
      background: transparent !important;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Lexend', sans-serif !important;
      font-weight: 300;
    }

    .widget-card {
      position: relative;
      background: rgba(10, 12, 20, 0.65) !important;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 18px 20px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
      -webkit-app-region: drag !important;
      user-select: none;
      overflow: hidden;
    }

    .widget-card * {
      pointer-events: none !important;
    }

    h1, h2, h3, p, span, div {
      color: #ffffff !important;
    }

    h2 {
      font-family: 'Cinzel', serif !important;
      font-size: 21px !important;
      font-weight: 600 !important;
      letter-spacing: 2px !important;
      white-space: nowrap !important;
      margin: 0 0 2px 0 !important;
    }

    /* Constellation Background */
    @keyframes constellationTwinkle {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.35; }
    }

    .constellation-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      opacity: 0.25;
      animation: constellationTwinkle 6s infinite ease-in-out;
    }

    /* Elongated Starburst Effect */
    .star-8pt {
      position: absolute;
      fill: rgba(255, 255, 255, 0.95);
      z-index: 2;
      animation: starGlow 4.5s infinite ease-in-out;
      filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.8));
    }

    @keyframes starGlow {
      0%, 100% { transform: scale(0.85); opacity: 0.35; }
      50% { transform: scale(1.15); opacity: 0.95; filter: drop-shadow(0 0 10px rgba(255, 255, 255, 1)); }
    }

    /* Organic Scattered Star Positions */
    .star-8pt-1 { top: 18px; left: 45px; width: 12px; height: 26px; transform: rotate(-12deg); animation-delay: 0s; }
    .star-8pt-2 { top: 95px; left: 15px; width: 20px; height: 44px; transform: rotate(6deg); animation-delay: 1.8s; }
    .star-8pt-3 { top: 35px; right: 28px; width: 14px; height: 30px; transform: rotate(-8deg); animation-delay: 3.2s; }
    .star-8pt-4 { bottom: 65px; right: 18px; width: 18px; height: 40px; transform: rotate(15deg); animation-delay: 0.9s; }
    .star-8pt-5 { bottom: 22px; left: 75px; width: 11px; height: 22px; transform: rotate(-5deg); animation-delay: 2.5s; }
    .star-8pt-6 { bottom: 18px; right: 55px; width: 13px; height: 28px; transform: rotate(10deg); animation-delay: 4.0s; }

    /* Shooting Star */
    @keyframes shootingStar {
      0% { transform: translate(0, 0) rotate(-35deg) scale(0); opacity: 0; }
      10% { transform: translate(-20px, 15px) rotate(-35deg) scale(1); opacity: 1; }
      30% { transform: translate(-140px, 90px) rotate(-35deg) scale(0.2); opacity: 0; }
      100% { transform: translate(-140px, 90px) rotate(-35deg) scale(0); opacity: 0; }
    }

    .shooting-star {
      position: absolute;
      top: 20px;
      right: 15px;
      width: 70px;
      height: 2px;
      background: linear-gradient(90deg, #ffffff, rgba(255, 255, 255, 0));
      border-radius: 999px;
      box-shadow: 0 0 6px #ffffff;
      animation: shootingStar 5s infinite linear;
      z-index: 3;
    }
  </style>
</head>
<body>

  <div class="widget-card">
    <!-- Constellation Lines Background -->
    <svg class="constellation-bg" viewBox="0 0 360 420" fill="none" stroke="white" stroke-width="0.75" stroke-dasharray="2 2">
      <polyline points="40,80 70,60 110,75 140,110 180,120 175,150 135,140 140,110" />
      <circle cx="40" cy="80" r="2" fill="white" />
      <circle cx="70" cy="60" r="2" fill="white" />
      <circle cx="110" cy="75" r="2" fill="white" />
      <circle cx="140" cy="110" r="2" fill="white" />
      <circle cx="180" cy="120" r="2" fill="white" />
      <circle cx="175" cy="150" r="2" fill="white" />
      <circle cx="135" cy="140" r="2" fill="white" />

      <polyline points="230,320 255,300 280,315 305,290 330,305" />
      <circle cx="230" cy="320" r="2" fill="white" />
      <circle cx="255" cy="300" r="2" fill="white" />
      <circle cx="280" cy="315" r="2" fill="white" />
      <circle cx="305" cy="290" r="2" fill="white" />
      <circle cx="330" cy="305" r="2" fill="white" />
    </svg>

    <!-- Shooting Star -->
    <div class="shooting-star"></div>

    <!-- Elongated Starburst Vector Elements -->
    <svg class="star-8pt star-8pt-1" viewBox="0 0 24 48"><path d="M12 0 L13.2 20 L20 18 L15 22 L24 24 L15 26 L20 30 L13.2 28 L12 48 L10.8 28 L4 30 L9 26 L0 24 L9 22 L4 18 L10.8 20 Z"/></svg>
    <svg class="star-8pt star-8pt-2" viewBox="0 0 24 48"><path d="M12 0 L13.2 20 L20 18 L15 22 L24 24 L15 26 L20 30 L13.2 28 L12 48 L10.8 28 L4 30 L9 26 L0 24 L9 22 L4 18 L10.8 20 Z"/></svg>
    <svg class="star-8pt star-8pt-3" viewBox="0 0 24 48"><path d="M12 0 L13.2 20 L20 18 L15 22 L24 24 L15 26 L20 30 L13.2 28 L12 48 L10.8 28 L4 30 L9 26 L0 24 L9 22 L4 18 L10.8 20 Z"/></svg>
    <svg class="star-8pt star-8pt-4" viewBox="0 0 24 48"><path d="M12 0 L13.2 20 L20 18 L15 22 L24 24 L15 26 L20 30 L13.2 28 L12 48 L10.8 28 L4 30 L9 26 L0 24 L9 22 L4 18 L10.8 20 Z"/></svg>
    <svg class="star-8pt star-8pt-5" viewBox="0 0 24 48"><path d="M12 0 L13.2 20 L20 18 L15 22 L24 24 L15 26 L20 30 L13.2 28 L12 48 L10.8 28 L4 30 L9 26 L0 24 L9 22 L4 18 L10.8 20 Z"/></svg>
    <svg class="star-8pt star-8pt-6" viewBox="0 0 24 48"><path d="M12 0 L13.2 20 L20 18 L15 22 L24 24 L15 26 L20 30 L13.2 28 L12 48 L10.8 28 L4 30 L9 26 L0 24 L9 22 L4 18 L10.8 20 Z"/></svg>

    <!-- Foreground Card Content -->
    <div style="text-align: center; position: relative; z-index: 4;">
      <h2>CELESTIAL GUIDE</h2>
      <div style="font-size: 11px; letter-spacing: 2px; opacity: 0.75; margin-bottom: 16px;">✦ LUNAR EPHEMERIS ✦</div>

      <div style="margin: 14px 0; display: flex; align-items: center; justify-content: center; gap: 14px;">
        <span style="font-size: 12px; opacity: 0.8;">✦</span>
        <div style="width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(90deg, #fffdf0 50%, #181a26 50%); box-shadow: 0 0 16px rgba(255, 253, 240, 0.35);"></div>
        <span style="font-size: 12px; opacity: 0.8;">✦</span>
      </div>

      <div style="font-size: 13px; opacity: 0.85; margin-bottom: 4px;">PHASE: <strong style="color: #fff; font-weight: 500;">Last Quarter</strong></div>
      <div style="font-size: 13px; opacity: 0.85;">MOON IN: <strong style="color: #fff; font-weight: 500;">Leo ♌</strong></div>

      <div style="margin-top: 16px; padding: 12px 14px; border: 1px dashed rgba(255,255,255,0.25); border-radius: 14px; font-style: italic; font-size: 12.5px; opacity: 0.9; line-height: 1.45;">
        "Lead with warm-hearted clarity and embrace your creative expression."
      </div>
    </div>
  </div>

</body>
</html>
