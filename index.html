<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading the Stars</title>
    <!-- Google Fonts: Cormorant Garamond & Quicksand -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Quicksand:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Soft dreamy cosmic gradient */
            background: radial-gradient(circle at center, #1b1937 0%, #0d0c1d 100%);
            font-family: 'Quicksand', sans-serif;
            color: #f3f0e6;
        }

        /* Luminous Frosted Glass Card */
        .widget-card {
            width: 330px;
            padding: 32px 26px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(243, 224, 185, 0.25);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.45),
                        inset 0 1px 0 0 rgba(255, 255, 255, 0.2);
            text-align: center;
            position: relative;
        }

        .widget-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            font-weight: 400;
            letter-spacing: 2px;
            margin-bottom: 6px;
            color: #fceecb;
            text-shadow: 0 2px 10px rgba(252, 238, 203, 0.3);
        }

        .widget-subtitle {
            font-size: 0.75rem;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: rgba(243, 240, 230, 0.6);
            margin-bottom: 18px;
        }

        /* Cute Illustration Container */
        .illustration-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 16px 0;
            position: relative;
        }

        .sparkle {
            font-size: 1.1rem;
            color: #fceecb;
            animation: pulse 2.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        .moon-graphic {
            width: 76px;
            height: 76px;
            margin: 0 12px;
            filter: drop-shadow(0 0 12px rgba(252, 238, 203, 0.4));
        }

        .moon-info {
            margin-top: 14px;
            font-size: 0.95rem;
            line-height: 1.7;
            color: rgba(243, 240, 230, 0.85);
        }

        .label {
            font-size: 0.85rem;
            color: rgba(243, 240, 230, 0.6);
        }

        .highlight {
            color: #fceecb;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="widget-card">
        <h1 class="widget-title">Reading the Stars</h1>
        <p class="widget-subtitle">✦ Lunar Ephemeris ✦</p>

        <div class="illustration-container">
            <span class="sparkle">✨</span>
            <!-- Cute Stylized Moon Illustration -->
            <svg class="moon-graphic" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="42" fill="#1b1937" stroke="#fceecb" stroke-width="2" />
                <!-- Crescent / Phase Shadow Overlay -->
                <path d="M 50 8 A 42 42 0 0 1 50 92 A 28 42 0 0 0 50 8 Z" fill="#fceecb" />
            </svg>
            <span class="sparkle">✨</span>
        </div>

        <div class="moon-info">
            <p><span class="label">Phase:</span> <span id="moon-phase" class="highlight">Last Quarter</span></p>
            <p><span class="label">Moon in:</span> <span id="moon-sign" class="highlight">Leo ♌</span></p>
        </div>
    </div>

    <script>
        async function fetchLiveMoonData() {
            try {
                const unixTime = Math.floor(Date.now() / 1000);
                const response = await fetch(`https://api.farmsense.net/v1/moonphases/?d=${unixTime}`);
                const data = await response.json();

                if (data && data.length > 0) {
                    const moon = data[0];
                    const phaseName = moon.Phase || "Last Quarter";
                    document.getElementById('moon-phase').innerText = phaseName;
                }
            } catch (err) {
                document.getElementById('moon-phase').innerText = "Last Quarter";
            }

            const now = new Date();
            const tropicalMonth = 27.321661;
            const refLeoDate = new Date(Date.UTC(2026, 9, 5, 12, 0)); 
            const daysSinceLeo = (now - refLeoDate) / (1000 * 60 * 60 * 24);
            let zodiacProgress = (daysSinceLeo / tropicalMonth) % 1;
            if (zodiacProgress < 0) zodiacProgress += 1;
            
            let signIndex = Math.floor((4 + (zodiacProgress * 12)) % 12);
            const zodiacSigns = [
                "Aries ♈", "Taurus ♉", "Gemini ♊", "Cancer ♋",
                "Leo ♌", "Virgo ♍", "Libra ♎", "Scorpio ♏",
                "Sagittarius ♐", "Capricorn ♑", "Aquarius ♒", "Pisces ♓"
            ];

            document.getElementById('moon-sign').innerText = zodiacSigns[signIndex];
        }

        fetchLiveMoonData();
    </script>
</body>
</html>
